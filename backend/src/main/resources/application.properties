# ── MongoDB ─────────────────────────────────────────────────────────────────
# Connection string — set MONGODB_URI env var in production
# For local dev, use application-dev.properties (run with -Dspring.profiles.active=dev)
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=classbridge_ai

# ── Server ──────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ── File upload ─────────────────────────────────────────────────────────────
# Defaults to ~/classbridge/uploads/recordings if UPLOAD_DIR is not set
file.upload-dir=${UPLOAD_DIR:${user.home}/classbridge/uploads/recordings}
