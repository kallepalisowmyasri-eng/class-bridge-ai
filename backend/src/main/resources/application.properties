# ── MongoDB ─────────────────────────────────────────────────────────────────
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=classbridge_ai

# ── Server ──────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ── File upload ─────────────────────────────────────────────────────────────
file.upload-dir=${UPLOAD_DIR:${user.home}/classbridge/uploads/recordings}
file.audio-dir=${AUDIO_DIR:${user.home}/classbridge/uploads/audio}
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB

# ── JWT ─────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:MyDefaultSecretKeyForDevelopmentOnly2026!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Transcription Service ───────────────────────────────────────────────────
transcription.service.url=${TRANSCRIPTION_URL:http://localhost:5000}

# ── Gemini AI ───────────────────────────────────────────────────────────────
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent}
gemini.api.key=${GEMINI_API_KEY:}
