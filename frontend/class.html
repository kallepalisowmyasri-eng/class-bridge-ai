<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Recovery — ClassBridge AI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Header Bar -->
  <header class="app-header">
    <div style="display:flex;align-items:center;gap:16px">
      <a href="dashboard.html" class="btn btn-ghost btn-sm" style="font-weight:600">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        Dashboard
      </a>
      <a href="dashboard.html" class="logo">Class<span>Bridge</span> AI</a>
    </div>
    <div class="header-actions">
      <div class="user-pill">
        <div class="user-avatar" id="user-avatar">?</div>
        <span id="user-name">Student</span>
      </div>
      <button class="btn btn-ghost btn-sm" id="logout-btn">Sign out</button>
    </div>
  </header>

  <div class="app-container">
    <!-- Class Hero Header -->
    <div class="detail-hero">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap">
        <div>
          <span style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--primary)" id="class-subject-header">Class Recovery</span>
          <h1 id="class-title" style="margin-top:2px">Loading class details...</h1>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="status-badge" id="class-status"></span>
        </div>
      </div>

      <div class="meta-row" style="margin-top:10px">
        <span class="meta-item" id="class-subject-display">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          <span id="class-subject">—</span>
        </span>
        <span class="meta-item" id="class-duration-display">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span id="class-duration">—</span>
        </span>
        <span class="meta-item" id="class-date-display">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span id="class-date">—</span>
        </span>
      </div>

      <p id="class-description" style="font-size:14px;color:var(--text-secondary);margin-top:10px;line-height:1.5"></p>

      <!-- Step-by-Step Processing Pipeline Widget -->
      <div class="pipeline-card" id="pipeline-card" style="display:none;margin-top:16px">
        <div class="pipeline-header">
          <div style="font-weight:700;font-size:14px;color:var(--text)" id="progress-status-label">Class Analysis in Progress</div>
          <span class="progress-pct" id="progress-text" style="font-weight:700;color:var(--primary)">0%</span>
        </div>
        <div class="progress-track" style="margin-bottom:14px">
          <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        </div>
        <div class="pipeline-steps">
          <div class="pipeline-step" id="step-upload">
            <span class="step-icon">📤</span>
            <span>1. Uploaded</span>
          </div>
          <div class="pipeline-step" id="step-audio">
            <span class="step-icon">🎵</span>
            <span>2. Audio Ready</span>
          </div>
          <div class="pipeline-step" id="step-transcribe">
            <span class="step-icon">📝</span>
            <span>3. Transcribed</span>
          </div>
          <div class="pipeline-step" id="step-analyze">
            <span class="step-icon">🧠</span>
            <span>4. Gap & Plan Analysis</span>
          </div>
          <div class="pipeline-step" id="step-ready">
            <span class="step-icon">🎯</span>
            <span>5. Recovery Ready</span>
          </div>
        </div>
      </div>

      <!-- Audio Player Card -->
      <div class="audio-player-card" id="audio-player-card" style="display:none;margin-top:16px">
        <audio id="class-audio-player" preload="metadata"></audio>
        <div class="audio-player-main">
          <button class="audio-play-btn" id="audio-play-btn" title="Play / Pause Audio">
            <svg class="icon-play" width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <svg class="icon-pause" width="20" height="20" fill="currentColor" viewBox="0 0 24 24" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          </button>
          <div class="audio-track-info">
            <div class="audio-title" id="audio-title">Class Audio Recording</div>
            <div class="audio-timeline-wrapper">
              <span class="audio-time" id="audio-curr-time">00:00</span>
              <input type="range" class="audio-seek-slider" id="audio-seek" value="0" min="0" max="100" step="0.1" aria-label="Audio playback seek">
              <span class="audio-time" id="audio-total-time">00:00</span>
            </div>
          </div>
          <div class="audio-actions">
            <select class="audio-speed-select" id="audio-speed" title="Playback Speed" aria-label="Playback Speed">
              <option value="1">1.0x</option>
              <option value="1.25">1.25x</option>
              <option value="1.5">1.5x</option>
              <option value="2">2.0x</option>
            </select>
            <button class="btn btn-ghost btn-sm" id="btn-download-recording" title="Download Recording" aria-label="Download Recording">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Structured Recovery Navigation Tabs -->
    <nav class="tab-bar" aria-label="Recovery Sections">
      <button class="tab-btn active" data-tab="overview">📝 Overview</button>
      <button class="tab-btn" data-tab="must-learn">🎯 Must Learn</button>
      <button class="tab-btn" data-tab="catchup">🗺️ Catch-up Path</button>
      <button class="tab-btn" data-tab="gaps">🔗 Learning Gaps</button>
      <button class="tab-btn" data-tab="explanations">💡 Concepts</button>
      <button class="tab-btn" data-tab="watch">⏱️ What to Watch</button>
      <button class="tab-btn" data-tab="quiz">❓ Quiz</button>
      <button class="tab-btn" data-tab="chat">💬 AI Tutor Chat</button>
      <button class="tab-btn" data-tab="prev-classes">📚 Previous Classes</button>
      <button class="tab-btn" data-tab="timestamps">⏱️ Timestamps</button>
      <button class="tab-btn" data-tab="assignments">📋 Tasks</button>
      <button class="tab-btn" data-tab="announcements">📢 Notices</button>
      <button class="tab-btn" data-tab="revision">✅ Revision</button>
      <button class="tab-btn" data-tab="resources">📁 Resources</button>
      <button class="tab-btn" data-tab="notes">📓 My Notes</button>
    </nav>

    <!-- Tab Panels Area -->
    <div id="tab-area">
      <div class="tab-panel active" id="tab-overview">
        <div class="loading"><div class="spinner"></div></div>
      </div>
      <div class="tab-panel" id="tab-must-learn"></div>
      <div class="tab-panel" id="tab-catchup"></div>
      <div class="tab-panel" id="tab-gaps"></div>
      <div class="tab-panel" id="tab-explanations"></div>
      <div class="tab-panel" id="tab-watch"></div>
      <div class="tab-panel" id="tab-quiz"></div>
      <div class="tab-panel" id="tab-chat"></div>
      <div class="tab-panel" id="tab-prev-classes"></div>
      <div class="tab-panel" id="tab-timestamps"></div>
      <div class="tab-panel" id="tab-assignments"></div>
      <div class="tab-panel" id="tab-announcements"></div>
      <div class="tab-panel" id="tab-revision"></div>
      <div class="tab-panel" id="tab-resources"></div>
      <div class="tab-panel" id="tab-notes"></div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/app.js"></script>
  <script>initClassDetail();</script>
</body>
</html>
