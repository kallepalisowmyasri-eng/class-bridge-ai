<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassBridge AI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-wrapper">
      <div class="auth-brand">
        <div class="logo">Class<span>Bridge</span> AI</div>
        <p class="tagline">Missed the class? Catch up smarter, not longer.</p>
      </div>

      <div class="auth-card">
        <div class="auth-tabs">
          <button class="auth-tab active" data-form="signup-form">Get Started</button>
          <button class="auth-tab" data-form="login-form">Log In</button>
        </div>

        <div id="signup-error" class="alert alert-error"></div>
        <form id="signup-form" class="auth-form active">
          <div class="form-group">
            <label class="form-label" for="signup-name">Full Name</label>
            <input class="form-input" type="text" id="signup-name" placeholder="e.g. Alex Johnson" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="signup-email">Email</label>
            <input class="form-input" type="email" id="signup-email" placeholder="you@university.edu" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="signup-password">Password</label>
            <input class="form-input" type="password" id="signup-password" placeholder="At least 6 characters" minlength="6" required>
          </div>
          <button type="submit" class="btn btn-primary btn-full btn-lg">Create Account</button>
          <p style="text-align:center;font-size:12px;color:var(--text-muted);margin-top:-8px">By continuing, you agree to our terms of service.</p>
        </form>

        <div id="login-error" class="alert alert-error"></div>
        <form id="login-form" class="auth-form">
          <div class="form-group">
            <label class="form-label" for="login-email">Email</label>
            <input class="form-input" type="email" id="login-email" placeholder="you@university.edu" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <input class="form-input" type="password" id="login-password" placeholder="Your password" required>
          </div>
          <button type="submit" class="btn btn-primary btn-full btn-lg">Log In</button>
        </form>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/app.js"></script>
  <script>initAuthPage();</script>
</body>
</html>
